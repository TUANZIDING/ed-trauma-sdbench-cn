<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .box{stroke-width:2;rx:12}
      .t{font-size:17px;font-weight:700;fill:#0f172a}
      .s{font-size:13px;fill:#334155}
      .l{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
      .lab{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ed-trauma-sdbench-cn 序贯诊断流程 / Sequential diagnosis flow</text>

  <!-- case source -->
  <rect class="box" x="30" y="70" width="210" height="96" fill="#f1f5f9" stroke="#64748b"/>
  <text class="t" x="135" y="102" text-anchor="middle">合成中文创伤病例</text>
  <text class="s" x="135" y="126" text-anchor="middle">cases/v0.1/*.md（15 例）</text>
  <text class="s" x="135" y="146" text-anchor="middle">→ dataset.json</text>

  <!-- agent / learner -->
  <rect class="box" x="300" y="70" width="230" height="96" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t" x="415" y="102" text-anchor="middle">诊断者 Agent / 学员</text>
  <text class="s" x="415" y="126" text-anchor="middle">只看到 case_summary</text>
  <text class="s" x="415" y="146" text-anchor="middle">提问 · 开检查 · 下诊断</text>

  <!-- gatekeeper -->
  <rect class="box" x="300" y="250" width="230" height="96" fill="#fef3c7" stroke="#d97706"/>
  <text class="t" x="415" y="282" text-anchor="middle">Gatekeeper 守门人</text>
  <text class="s" x="415" y="306" text-anchor="middle">持有 full_text，按问按需返回</text>
  <text class="s" x="415" y="326" text-anchor="middle">不泄露诊断，缺失则合成</text>

  <!-- judge -->
  <rect class="box" x="640" y="70" width="290" height="96" fill="#dcfce7" stroke="#16a34a"/>
  <text class="t" x="785" y="102" text-anchor="middle">Judge 评分</text>
  <text class="s" x="785" y="126" text-anchor="middle">对照 final_diagnosis，1–5 分</text>
  <text class="s" x="785" y="146" text-anchor="middle">≥4 视为正确</text>

  <!-- costing -->
  <rect class="box" x="640" y="250" width="290" height="96" fill="#fce7f3" stroke="#db2777"/>
  <text class="t" x="785" y="282" text-anchor="middle">中文成本表计价（人民币）</text>
  <text class="s" x="785" y="306" text-anchor="middle">cn-cost-sheetv0.1.csv · 江苏/无锡公开价</text>
  <text class="s" x="785" y="326" text-anchor="middle">每轮诊查费 + 已执行检查</text>

  <!-- outputs -->
  <rect class="box" x="300" y="430" width="300" height="96" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="450" y="462" text-anchor="middle">A：AI 评测</text>
  <text class="s" x="450" y="486" text-anchor="middle">准确率 × 人均费用（帕累托）</text>
  <text class="s" x="450" y="506" text-anchor="middle">按模型 / 病例集汇总</text>

  <rect class="box" x="630" y="430" width="300" height="96" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="780" y="462" text-anchor="middle">B：学员反馈报告</text>
  <text class="s" x="780" y="486" text-anchor="middle">提问数 · 检查数 · 费用 · 用时 · 得分</text>
  <text class="s" x="780" y="506" text-anchor="middle">遗漏关键检查 · 鉴别 · 指南</text>

  <!-- arrows -->
  <path class="l" d="M240,118 L298,118"/>
  <text class="lab" x="250" y="108">摘要</text>
  <path class="l" d="M135,166 L135,298 L298,298"/>
  <text class="lab" x="145" y="290">全文</text>
  <path class="l" d="M395,166 L395,248"/>
  <text class="lab" x="330" y="212">提问/检查</text>
  <path class="l" d="M435,248 L435,168"/>
  <text class="lab" x="443" y="212">结果</text>
  <path class="l" d="M530,118 L638,118"/>
  <text class="lab" x="550" y="108">最终诊断</text>
  <path class="l" d="M530,320 L638,320"/>
  <text class="lab" x="545" y="310">检查清单</text>
  <path class="l" d="M785,166 C785,200 600,200 600,428"/>
  <path class="l" d="M785,346 L785,428"/>
  <path class="l" d="M720,346 L520,428"/>
  <path class="l" d="M860,166 C930,250 930,380 880,428"/>
</svg>

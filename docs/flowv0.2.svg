<text x="712" y="350" font-size="13.5" fill="#96704f" font-weight="700">返回结果</text>
<rect x="565" y="328" width="80" height="30" rx="15" fill="#1f2a2b"/><text x="605" y="348" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">循环 N 轮</text>
<path d="M755 195 L 874 195" fill="none" stroke="#5b5446" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="772" y="164" width="84" height="24" rx="12" fill="#efe7d8"/><text x="814" y="181" font-size="12.5" fill="#5b5446" text-anchor="middle">最终诊断</text>
<path d="M755 495 L 874 495" fill="none" stroke="#5b5446" stroke-width="2.2" marker-end="url(#ar)"/>

<text x="48" y="62" font-size="28" font-weight="700" fill="#1f2a2b">一例病例怎么走完</text>
<text x="48" y="90" font-size="15" fill="#6b6455">How one case runs: summary → ask &amp; order → diagnose → score &amp; cost</text>
<g filter="url(#sh)"><rect x="40" y="140" width="280" height="250" rx="18" fill="#ffffff" stroke="#d9cfbd" stroke-width="1.5"/></g>
<circle cx="70" cy="174" r="15" fill="#96704f"/><text x="70" y="179" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="94" y="180" font-size="20" font-weight="700" fill="#1f2a2b">合成病例</text>
<text x="94" y="202" font-size="12.5" fill="#5b5446" opacity=".85">Synthetic cases</text>
<text x="64" y="234" font-size="15" fill="#1f2a2b">15 例中文急诊创伤</text>
<text x="64" y="258" font-size="15" fill="#1f2a2b">dev 9 例 · test 6 例</text>
<text x="64" y="282" font-size="15" fill="#1f2a2b">全部虚构，无真实患者</text>
<text x="64" y="306" font-size="15" fill="#1f2a2b">参考诊断 + 关键鉴别</text>
<text x="64" y="330" font-size="15" fill="#1f2a2b">→ dataset.json</text>
<g filter="url(#sh)"><rect x="455" y="120" width="300" height="150" rx="18" fill="url(#teal)"/></g>
<circle cx="485" cy="154" r="15" fill="#d4a64a"/><text x="485" y="159" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="509" y="160" font-size="20" font-weight="700" fill="#fff">诊断者</text><text x="509" y="182" font-size="12.5" fill="#d7ecea">Diagnostic agent · AI 或学员</text>
<text x="479" y="216" font-size="15" fill="#fff">起点只有一句话摘要</text><text x="479" y="242" font-size="15" fill="#fff">每轮：提问、开检查，或下诊断</text>
<g filter="url(#sh)"><rect x="455" y="420" width="300" height="150" rx="18" fill="#fbf4e4" stroke="#d9bf8a" stroke-width="1.5"/></g>
<circle cx="485" cy="454" r="15" fill="#b08a4a"/><text x="485" y="459" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="509" y="460" font-size="20" font-weight="700" fill="#1f2a2b">守门人</text>
<text x="509" y="482" font-size="12.5" fill="#5b5446" opacity=".85">Gatekeeper · 持有病例全文</text>
<text x="479" y="514" font-size="15" fill="#1f2a2b">只回答被问到的内容</text>
<text x="479" y="538" font-size="15" fill="#1f2a2b">没问的阳性结果绝不主动给</text>
<g filter="url(#sh)"><rect x="880" y="120" width="280" height="150" rx="18" fill="#ffffff" stroke="#d8c3cc" stroke-width="1.5"/></g>
<circle cx="910" cy="154" r="15" fill="#8e3b5a"/><text x="910" y="159" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="934" y="160" font-size="20" font-weight="700" fill="#1f2a2b">Judge 评分</text>
<text x="934" y="182" font-size="12.5" fill="#5b5446" opacity=".85">对照参考诊断</text>
<text x="904" y="214" font-size="15" fill="#1f2a2b">1–5 分，≥4 分算正确</text>
<text x="904" y="238" font-size="15" fill="#1f2a2b">记录轮数与提问数</text>
<g filter="url(#sh)"><rect x="880" y="420" width="280" height="150" rx="18" fill="#ffffff" stroke="#c9d2c6" stroke-width="1.5"/></g>
<circle cx="910" cy="454" r="15" fill="#637568"/><text x="910" y="459" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="934" y="460" font-size="20" font-weight="700" fill="#1f2a2b">人民币计价</text>
<text x="934" y="482" font-size="12.5" fill="#5b5446" opacity=".85">Costing · 可替换成本表</text>
<text x="904" y="514" font-size="15" fill="#1f2a2b">诊查费 25 元/轮</text>
<text x="904" y="538" font-size="15" fill="#1f2a2b">检查按江苏/无锡指导价</text>

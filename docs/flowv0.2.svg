<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, Noto Sans CJK SC, sans-serif" role="img" aria-label="序贯诊断流程：合成病例、诊断者、守门人循环、Judge 评分与人民币计价，输出 AI 评测与学员反馈">
<defs>

<text x="70" y="672" font-size="20" font-weight="700" fill="#fff">A · 评测 AI</text><text x="190" y="672" font-size="13" fill="#d7ecea">Benchmark models</text>
<text x="70" y="704" font-size="15" fill="#fff">准确率 · 平均费用 · 平均轮数 → 模型横向比较</text>

<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1f5f63"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>

<text x="670" y="672" font-size="20" font-weight="700" fill="#fff">B · 训练学员</text><text x="800" y="672" font-size="13" fill="#f3dde5">Train residents</text>
<text x="670" y="704" font-size="15" fill="#fff">提问 · 检查 · 费用 · 用时 · 得分 → 个人反馈报告</text>
